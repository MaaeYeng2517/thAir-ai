version: "3.8"

services:
  # ============================================================
  # Layer 4: Data & Integration
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: thair-postgres
    environment:
      POSTGRES_DB: thair_ai
      POSTGRES_USER: thair
      POSTGRES_PASSWORD: thair_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thair -d thair_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thair-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:1.12
    container_name: thair-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: thair-minio
    environment:
      MINIO_ROOT_USER: thair
      MINIO_ROOT_PASSWORD: thair_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # Layer 5: Infrastructure - Queue / Worker
  # ============================================================

  # Redis is used as queue broker (Redis Queue / Bull)

  # ============================================================
  # Volumes
  # ============================================================

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
